<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supervisor · Gerenciador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="plataforma.css">
  <script src="plataforma.js"></script>
  <script>Auth.exigir('supervisor');</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
</defs></svg>

<header class="topbar">
  <div class="wrap topbar-in" style="width:min(100% - 32px, 860px)">
    <div class="brand">
      <span class="brand-logo"><svg class="ico"><use href="#i-layers"/></svg></span>
      <span><strong>Gerenciador</strong><small>Painel do supervisor</small></span>
    </div>
    <div class="topbar-actions">
      <span class="user-chip"><span class="av" id="u-av"></span><span class="nm" id="u-nome"></span><small>Supervisor</small></span>
      <button class="btn-ghost sm" type="button" id="sair"><svg class="ico"><use href="#i-logout"/></svg> Sair</button>
    </div>
  </div>
</header>

<main class="sup-wrap" id="painel"></main>

<script>
  const $ = (id) => document.getElementById(id);
  const ico = (n) => `<svg class="ico"><use href="#i-${n}"/></svg>`;
  const COLABS = USUARIOS.filter((u) => u.papel === 'colaborador');
  let atual = localStorage.getItem('supervisor-colab');
  if (!COLABS.some((c) => c.usuario === atual)) atual = COLABS[0].usuario;
  let aba = 'jogo', filtro = '';
  const sessao = Auth.sessao();
  const iniciais = (n) => n.split(' ').map((x) => x[0]).slice(0, 2).join('').toUpperCase();
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  if (sessao) { $('u-nome').textContent = sessao.nome; $('u-av').textContent = iniciais(sessao.nome); }
  $('sair').addEventListener('click', () => Auth.sair());

  const linha = (rotulo, atualV, total) => `
    <div class="mrow"><div><span>${rotulo}</span><b>${atualV}/${total}</b></div>
      <div class="bar"><i style="width:${total ? Math.min(100, (atualV / total) * 100) : 0}%"></i></div></div>`;

  function cartaoFase(id, f) {
    if (!f) return `<article class="card fase-card vazia">${Progresso.rotulo(id)}<br>Ainda não iniciada</article>`;
    const ok = f.status === 'concluida';
    return `<article class="card fase-card">
      <h3>${esc(Progresso.rotulo(id, f))}<span class="tag ${ok ? 'st-ok' : 'st-and'}">${ok ? 'Concluída' : 'Em andamento'}</span></h3>
      ${f.totalDuvidas ? linha('Dúvidas coletadas', f.duvidas, f.totalDuvidas) : ''}
      ${f.totalCrachas ? linha('Crachás', f.crachas, f.totalCrachas) : ''}
      ${f.totalCheckpoints ? linha('Checkpoints', f.checkpoints, f.totalCheckpoints) : ''}
      ${f.temCofre ? linha('Projeto retirado do cofre', f.projeto ? 1 : 0, 1) : ''}
      <div class="foot">
        <span class="tag">Tentativas: ${f.tentativas}</span><span class="tag">Game overs: ${f.gameOvers}</span>
        <span class="tag">Vidas perdidas: ${f.vidasPerdidas}</span><span class="tag">Tempo: ${fmtTempo(f.tempoMs)}</span>
      </div></article>`;
  }

  const kpi = (cor, icone, rotulo, valor, sub, grande) => `<article class="card kpi"><div class="kpi-h"><span class="stat-ico ${cor}">${ico(icone)}</span>${rotulo}</div><b${grande ? ' style="font-size:17px"' : ''}>${valor}</b><small>${sub}</small></article>`;

  /* ---- aba: progresso no jogo ---- */
  function abaJogo(c) {
    const p = Progresso.ler(c.usuario);
    const n = p.totalFases || 2;
    const fases = Array.from({ length: n }, (_, i) => p.fases[i + 1]);
    const feitas = fases.filter((f) => f && f.status === 'concluida').length;
    const pct = Progresso.percentual(p);
    const st = !p.iniciadoEm ? ['st-nao', 'Não iniciou'] : p.concluido ? ['st-ok', 'Concluído'] : ['st-and', 'Em andamento'];
    const todas = fases.filter(Boolean);
    const soma = (k) => todas.reduce((a, f) => a + f[k], 0);
    const tempo = todas.reduce((a, f) => a + (f.tempoMs || 0), 0);
    const eventos = p.eventos.slice(-12).reverse();
    return `
      <section class="card sup-head">
        <span class="av">${iniciais(c.nome)}</span>
        <div class="info"><h2>${esc(c.nome)}</h2><small>Última atividade no jogo: ${fmtQuando(p.ultimaAtividade)}</small>
          <div class="sup-bar"><i style="width:${pct}%"></i></div><small>${pct}% do onboarding concluído</small></div>
        <span class="tag ${st[0]}">${st[1]}</span>
      </section>
      <div class="stat-grid flat">
        ${kpi('green', 'check-circle', 'Fases', `${feitas}/${n}`, 'concluídas')}
        ${kpi('blue', 'zap', 'Tentativas', soma('tentativas'), `${soma('gameOvers')} game over(s)`)}
        ${kpi('amber', 'activity', 'Vidas perdidas', soma('vidasPerdidas'), 'em todas as fases')}
        ${kpi('violet', 'clock', 'Tempo', fmtTempo(tempo || null), 'nas fases concluídas', true)}
      </div>
      <div class="sup-grid">${fases.map((f, i) => cartaoFase(i + 1, f)).join('')}</div>
      <article class="card" style="padding:16px">
        <header class="card-h"><h3>Atividade recente no jogo</h3><span>últimos ${eventos.length} eventos</span></header>
        ${eventos.length ? `<ul class="timeline">${eventos.map((e) => `<li><time>${fmtQuando(e.t)}</time><span>${esc(e.texto)}</span></li>`).join('')}</ul>`
          : '<div class="empty" style="padding:24px"><h3>Sem atividade ainda</h3><p>Os eventos aparecem quando o colaborador começa a jogar.</p></div>'}
      </article>`;
  }

  /* ---- aba: progresso na empresa (atividades) ---- */
  function abaEmpresa(c) {
    const it = Tarefas.ler(c.usuario), N = Tarefas.nomes;
    const cont = (s) => it.filter((x) => x.status === s).length;
    const taxa = it.length ? Math.round((cont('concluido') * 100) / it.length) : 0;
    const urg = it.filter((x) => x.status !== 'concluido' && (x.prioridade === 'urgente' || x.prioridade === 'alta')).length;
    const ordem = { urgente: 0, alta: 1, media: 2, baixa: 3 };
    const lista = it.filter((x) => !filtro || x.status === filtro)
      .sort((a, b) => (a.status === 'concluido') - (b.status === 'concluido') || ordem[a.prioridade] - ordem[b.prioridade]);
    const fl = [['', 'Todas'], ['pendente', 'Pendentes'], ['ativo', 'Ativas'], ['concluido', 'Concluídas']];
    return `
      <section class="card sup-head">
        <span class="av">${iniciais(c.nome)}</span>
        <div class="info"><h2>${esc(c.nome)}</h2><small>Atividades na empresa</small>
          <div class="sup-bar"><i style="width:${taxa}%"></i></div><small>${taxa}% das atividades concluídas</small></div>
        <span class="tag ${urg ? 'st-nao' : 'st-ok'}">${urg ? urg + ' alta/urgente em aberto' : 'Sem urgências em aberto'}</span>
      </section>
      <div class="stat-grid flat">
        ${kpi('violet', 'layers', 'Total', it.length, 'atividades')}
        ${kpi('amber', 'clock', 'Pendentes', cont('pendente'), 'aguardando ação')}
        ${kpi('blue', 'zap', 'Ativas', cont('ativo'), 'em andamento')}
        ${kpi('green', 'check-circle', 'Concluídas', cont('concluido'), `${taxa}% de conclusão`)}
      </div>
      <article class="card" style="padding:16px">
        <header class="card-h"><h3>Atividades de ${esc(c.nome.split(' ')[0])}</h3><span>${lista.length} exibida(s)</span></header>
        <div class="filtros">${fl.map(([v, r]) => `<button type="button" class="pill ${filtro === v ? 'on' : ''}" data-f="${v}">${r}</button>`).join('')}</div>
        ${lista.length ? `<ul class="timeline">${lista.map((x) => `
          <li class="tarefa ${x.status === 'concluido' ? 'feita' : ''}"><h4>${esc(x.titulo)}</h4>${x.descricao ? `<p>${esc(x.descricao)}</p>` : ''}
            <div class="tags"><span class="tag st-${x.status}"><i class="dot"></i>${N.status[x.status]}</span>
              <span class="tag pr-${x.prioridade}">${N.prioridade[x.prioridade]}</span><span class="tag cat-${x.categoria}">${N.categoria[x.categoria]}</span></div></li>`).join('')}</ul>`
          : '<div class="empty" style="padding:24px"><h3>Nenhuma atividade</h3><p>Não há atividades com este filtro.</p></div>'}
      </article>`;
  }

  function render() {
    const c = COLABS.find((x) => x.usuario === atual);
    const seletor = COLABS.map((x) => {
      const t = Tarefas.ler(x.usuario);
      return `<button type="button" class="colab-btn ${x.usuario === atual ? 'on' : ''}" data-colab="${x.usuario}">
        <span class="av">${iniciais(x.nome)}</span><span><b>${esc(x.nome)}</b>
        <small>Jogo ${Progresso.percentual(Progresso.ler(x.usuario))}% · Atividades ${t.filter((i) => i.status === 'concluido').length}/${t.length}</small></span></button>`;
    }).join('');
    $('painel').innerHTML = `
      <div class="sel-colab">${seletor}</div>
      <nav class="tabs sup" aria-label="Seções do supervisor">
        <button class="tab ${aba === 'jogo' ? 'active' : ''}" type="button" data-sup-aba="jogo">${ico('zap')} Progresso no jogo</button>
        <button class="tab ${aba === 'empresa' ? 'active' : ''}" type="button" data-sup-aba="empresa">${ico('layers')} Progresso na empresa</button>
      </nav>
      <div style="margin-top:14px">${aba === 'jogo' ? abaJogo(c) : abaEmpresa(c)}</div>`;
  }

  $('painel').addEventListener('click', (e) => {
    const c = e.target.closest('[data-colab]'), t = e.target.closest('[data-sup-aba]'), f = e.target.closest('[data-f]');
    if (c) { atual = c.dataset.colab; filtro = ''; try { localStorage.setItem('supervisor-colab', atual); } catch (x) {} }
    else if (t) aba = t.dataset.supAba;
    else if (f) filtro = f.dataset.f;
    else return;
    render();
  });

  render();
  window.addEventListener('storage', render);   // atualiza quando o colaborador joga ou edita tarefas em outra aba
  setInterval(render, 5000);
</script>
</body>
</html>
